<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img">
<title>workflow</title>
<rect x="0" y="0" width="1800" height="1220" rx="0" fill="#F6F8FB" stroke="#F6F8FB"/>
<text x="70" y="60" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#2667A5">PRODUCT WORKFLOW</text>
<text x="70" y="140" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="50" font-weight="700" fill="#163047">从一个输入，走到可核对的交付</text>
<text x="70" y="199" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#163047">每一步有输入、产物和门槛；有代码不等于已批准或已发布。</text>
<rect x="60" y="280" width="405" height="260" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="86" y="335" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">01 登记来源</text>
<text x="86" y="396" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">01-inputs：保存原意与权</text>
<text x="86" y="438" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">限</text>
<rect x="485" y="280" width="405" height="260" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="511" y="335" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">02 理解与规划</text>
<text x="511" y="396" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">02 / 03：核对事实、分析</text>
<text x="511" y="438" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">方案</text>
<rect x="910" y="280" width="405" height="260" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="936" y="335" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">03 候选与定义</text>
<text x="936" y="396" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">04 / 05：需求ID、范围和</text>
<text x="936" y="438" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">验收</text>
<rect x="1335" y="280" width="405" height="260" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="1361" y="335" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">04 评审与承诺</text>
<text x="1361" y="396" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">07 / 06：人确认取舍和版</text>
<text x="1361" y="438" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">本</text>
<rect x="1335" y="655" width="405" height="260" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="1361" y="710" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">05 实施与测试</text>
<text x="1361" y="771" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">10-code：提交实现与真实</text>
<text x="1361" y="813" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">检查</text>
<rect x="910" y="655" width="405" height="260" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="936" y="710" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">06 封存与产物</text>
<text x="936" y="771" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">06 / outputs：精确提交</text>
<text x="936" y="813" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">、hash与保管</text>
<rect x="485" y="655" width="405" height="260" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="511" y="710" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">07 授权交付</text>
<text x="511" y="771" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">部署、安装或导出；实际核</text>
<text x="511" y="813" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">对</text>
<rect x="60" y="655" width="405" height="260" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="86" y="710" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">08 反馈与复盘</text>
<text x="86" y="771" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">07 → 01：失败保留、新</text>
<text x="86" y="813" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" fill="#163047">问题再登记</text>
<line x1="470" y1="415" x2="479" y2="415" stroke="#2667A5" stroke-width="4"/>
<polygon points="479,415 466,407 466,423" fill="#2667A5"/>
<line x1="895" y1="415" x2="904" y2="415" stroke="#2667A5" stroke-width="4"/>
<polygon points="904,415 891,407 891,423" fill="#2667A5"/>
<line x1="1320" y1="415" x2="1329" y2="415" stroke="#2667A5" stroke-width="4"/>
<polygon points="1329,415 1316,407 1316,423" fill="#2667A5"/>
<line x1="1330" y1="790" x2="1321" y2="790" stroke="#2667A5" stroke-width="4"/>
<polygon points="1321,790 1334,782 1334,798" fill="#2667A5"/>
<line x1="905" y1="790" x2="896" y2="790" stroke="#2667A5" stroke-width="4"/>
<polygon points="896,790 909,782 909,798" fill="#2667A5"/>
<line x1="480" y1="790" x2="471" y2="790" stroke="#2667A5" stroke-width="4"/>
<polygon points="471,790 484,782 484,798" fill="#2667A5"/>
<text x="1340" y="593" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#2667A5">向下进入实施</text>
<line x1="1535" y1="545" x2="1535" y2="640" stroke="#2667A5" stroke-width="4"/>
<rect x="60" y="990" width="1680" height="135" rx="20" fill="#FFF6E7" stroke="#DCE4ED"/>
<text x="90" y="1036" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#2667A5">阶段门槛</text>
<text x="90" y="1082" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">正式批准、生产发布、未授权费用或有损数据操作需要明确依据；AI不能替负责人签字。</text>
</svg>
