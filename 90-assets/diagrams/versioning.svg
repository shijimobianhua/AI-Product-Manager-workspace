<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img">
<title>versioning</title>
<rect x="0" y="0" width="1800" height="1120" rx="0" fill="#F6F8FB" stroke="#F6F8FB"/>
<text x="70" y="60" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700" fill="#2667A5">VERSION &amp; RECOVERY</text>
<text x="70" y="140" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="50" font-weight="700" fill="#163047">先保管B版，再从A版继续C版</text>
<text x="70" y="199" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" fill="#163047">失败迭代也有价值；恢复必须指向精确提交并先独立验证。</text>
<rect x="60" y="300" width="320" height="330" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="86" y="355" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">A：明确基线</text>
<text x="86" y="415" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">记录提交与已知验收</text>
<rect x="400" y="300" width="320" height="330" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="426" y="355" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">B：本次迭代</text>
<text x="426" y="415" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">小步提交；核对未提交</text>
<text x="426" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">内容</text>
<rect x="740" y="300" width="320" height="330" rx="20" fill="#EAF2FA" stroke="#DCE4ED"/>
<text x="766" y="355" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">保管B</text>
<text x="766" y="415" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">归档引用、bundle、h</text>
<text x="766" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">ash与收据</text>
<rect x="1080" y="300" width="320" height="330" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="1106" y="355" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">独立恢复A</text>
<text x="1106" y="415" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">验证依赖、构建、测试</text>
<text x="1106" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">与兼容</text>
<rect x="1420" y="300" width="320" height="330" rx="20" fill="#EAF5F0" stroke="#DCE4ED"/>
<text x="1446" y="355" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">C：新路线</text>
<text x="1446" y="415" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">保留B；以后可比较或</text>
<text x="1446" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">复用提交</text>
<line x1="384" y1="465" x2="396" y2="465" stroke="#2667A5" stroke-width="4"/>
<polygon points="396,465 383,457 383,473" fill="#2667A5"/>
<line x1="724" y1="465" x2="736" y2="465" stroke="#2667A5" stroke-width="4"/>
<polygon points="736,465 723,457 723,473" fill="#2667A5"/>
<line x1="1064" y1="465" x2="1076" y2="465" stroke="#2667A5" stroke-width="4"/>
<polygon points="1076,465 1063,457 1063,473" fill="#2667A5"/>
<line x1="1404" y1="465" x2="1416" y2="465" stroke="#2667A5" stroke-width="4"/>
<polygon points="1416,465 1403,457 1403,473" fill="#2667A5"/>
<rect x="60" y="730" width="540" height="230" rx="20" fill="#FFF6E7" stroke="#DCE4ED"/>
<text x="86" y="785" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">源码取回</text>
<text x="86" y="845" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">Git历史和文档可恢复</text>
<rect x="630" y="730" width="540" height="230" rx="20" fill="#FFF6E7" stroke="#DCE4ED"/>
<text x="656" y="785" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">运行包切换</text>
<text x="656" y="845" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">目标环境真实可用</text>
<rect x="1200" y="730" width="540" height="230" rx="20" fill="#FFF6E7" stroke="#DCE4ED"/>
<text x="1226" y="785" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700" fill="#2667A5">数据兼容</text>
<text x="1226" y="845" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" fill="#163047">先保管当前数据，不盲降级</text>
<text x="60" y="1056" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700" fill="#28766B">三个恢复结论分别验证；本机bundle不等于异地备份，也不等于应用已恢复运行。</text>
</svg>
